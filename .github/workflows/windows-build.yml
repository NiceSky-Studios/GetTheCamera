name: Windows v1.8.1 Build

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        working-directory: windows
        run: npm install
      - name: Build NSIS installer and portable ZIP
        working-directory: windows
        run: |
          npm run dist
          Compress-Archive -Path dist/win-unpacked -DestinationPath dist/GetTheCamera-v1.8.1-windows.zip
      - name: Upload Windows release assets
        working-directory: windows
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view v1.8.1 --repo NiceSky-Studios/GetTheCamera 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create v1.8.1 --repo NiceSky-Studios/GetTheCamera --title "GetTheCamera v1.8.1" --notes-file ../RELEASE_NOTES.md
          }
          Get-ChildItem dist -Filter "*.exe" | ForEach-Object { gh release upload v1.8.1 --repo NiceSky-Studios/GetTheCamera $_.FullName --clobber }
          Get-ChildItem dist -Filter "*.zip" | ForEach-Object { gh release upload v1.8.1 --repo NiceSky-Studios/GetTheCamera $_.FullName --clobber }
          Get-ChildItem dist -Filter "latest*.yml" | ForEach-Object { gh release upload v1.8.1 --repo NiceSky-Studios/GetTheCamera $_.FullName --clobber }
      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: getthecamera-windows-v1.8.1
          path: windows/dist/*.*
