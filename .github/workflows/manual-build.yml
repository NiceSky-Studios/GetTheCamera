name: Manual Build

permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Semantic version, e.g. 1.2.3 or v1.2.3"
        required: true
        type: string

jobs:
  build:
    name: Build
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0



      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install Developer ID certificate
        if: ${{ secrets.DEVELOPER_ID_CERTIFICATE_P12 != '' }}
        env:
          CERTIFICATE_P12: ${{ secrets.DEVELOPER_ID_CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/getthecamera.keychain-db"
          security create-keychain -p "$RUNNER_TEMP" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$RUNNER_TEMP" "$KEYCHAIN_PATH"
          echo "$CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" \
            -P "$CERTIFICATE_PASSWORD" \
            -A \
            -t cert \
            -f pkcs12 \
            -k "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain-db
          security set-key-partition-list -S apple-tool:,apple: -s -k "$RUNNER_TEMP" "$KEYCHAIN_PATH"

      - name: Normalize semantic version
        id: version_meta
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          RAW="${INPUT_VERSION}"
          VERSION="${RAW#v}"

          if [[ ! "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid version '${RAW}'. Use e.g. 1.2.3, v1.2.3, or 1.0.0-beta.1." >&2
            exit 1
          fi

          # A pre-release suffix (e.g. -beta.1) marks a beta build: a GitHub
          # pre-release, shipped to the beta Sparkle channel only.
          if [[ "${VERSION}" == *-* ]]; then
            IS_PRERELEASE="true"
          else
            IS_PRERELEASE="false"
          fi

          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "release_tag=v${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "is_prerelease=${IS_PRERELEASE}" >> "${GITHUB_OUTPUT}"



      - name: Build package
        env:
          POSTHOG_PROJECT_TOKEN: ${{ secrets.POSTHOG_PROJECT_TOKEN }}
          POSTHOG_HOST: ${{ secrets.POSTHOG_HOST || vars.POSTHOG_HOST }}
          GETTHECAMERA_GOOGLE_CLIENT_ID: ${{ secrets.GETTHECAMERA_GOOGLE_CLIENT_ID }}
          GETTHECAMERA_SIGNING_IDENTITY: ${{ secrets.GETTHECAMERA_SIGNING_IDENTITY }}
          GETTHECAMERA_REQUIRE_DEVELOPER_ID: ${{ secrets.GETTHECAMERA_REQUIRE_DEVELOPER_ID || '0' }}
        run: bash scripts/build-package.sh --version "${{ steps.version_meta.outputs.version }}"

      - name: Create zip artifact
        run: |
          ZIP_PATH="dist/GetTheCamera-${{ steps.version_meta.outputs.release_tag }}.zip"
          ditto -c -k --sequesterRsrc --keepParent "dist/GetTheCamera.app" "${ZIP_PATH}"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: getthecamera-build
          path: |
            dist/*.dmg
            dist/*.zip
            dist/appcast.xml
            dist/GetTheCamera.app
          if-no-files-found: error

      - name: Generate Changelog
        id: changelog
        run: |
          git fetch --tags --force
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -z "$PREV_TAG" ]; then
            LOG=$(git log --pretty=format:"- %s" HEAD)
          else
            LOG=$(git log --pretty=format:"- %s" ${PREV_TAG}..HEAD)
          fi
          EOF=$(dd if=/dev/urandom bs=15 count=1 status=none | base64)
          echo "body<<$EOF" >> "${GITHUB_OUTPUT}"
          echo "$LOG" >> "${GITHUB_OUTPUT}"
          echo "$EOF" >> "${GITHUB_OUTPUT}"

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version_meta.outputs.release_tag }}
          name: GetTheCamera ${{ steps.version_meta.outputs.release_tag }}
          target_commitish: ${{ github.sha }}
          body: ${{ steps.changelog.outputs.body }}
          prerelease: ${{ steps.version_meta.outputs.is_prerelease }}
          generate_release_notes: true
          files: |
            dist/*.dmg
            dist/*.zip
          overwrite_files: true
          fail_on_unmatched_files: true

      - name: Post Changelog to Discord
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -z "${DISCORD_WEBHOOK}" ]; then
            echo "missing DISCORD_WEBHOOK secret"
            exit 0
          fi
          
          # Fetch the generated release notes using the GitHub CLI
          RELEASE_BODY=$(gh release view "${{ steps.version_meta.outputs.release_tag }}" --json body -q .body)
          
          # Construct a Discord embed payload
          # Truncate the body to Discord's 4096 character limit for embed descriptions just in case
          TRUNCATED_BODY="${RELEASE_BODY:0:4000}"
          if [ "${#RELEASE_BODY}" -gt 4000 ]; then
            TRUNCATED_BODY="${TRUNCATED_BODY}..."
          fi
          
          JSON_PAYLOAD=$(jq -n \
            --arg title "GetTheCamera ${{ steps.version_meta.outputs.release_tag }} Released!" \
            --arg desc "$TRUNCATED_BODY" \
            --arg url "https://github.com/${{ github.repository }}/releases/tag/${{ steps.version_meta.outputs.release_tag }}" \
            '{embeds: [{title: $title, description: $desc, url: $url, color: 5814783}]}')
            
          curl -s -X POST -H "Content-Type: application/json" -d "$JSON_PAYLOAD" "${DISCORD_WEBHOOK}"
